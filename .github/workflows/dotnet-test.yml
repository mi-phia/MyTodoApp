
name: MyTodoApp CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build-and-test:

    # Windows環境で実行する
    runs-on: windows-latest

    steps:
      # GitHubからソースコードを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # .NET SDKを準備
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGetパッケージを復元
      - name: Restore dependencies
        run: dotnet restore MyTodoApp.slnx

      # Releaseビルド
      - name: Build
        run: dotnet build MyTodoApp.slnx --configuration Release --no-restore

      # 単体テスト
      - name: Test
        run: dotnet test MyTodoApp.slnx --configuration Release --no-build
